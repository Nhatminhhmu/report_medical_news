name: Medical News Intelligence

on:
  schedule:
    # 22:30 Asia/Ho_Chi_Minh = 15:30 UTC
    - cron: "30 15 * * *"

  workflow_dispatch:

concurrency:
  group: medical-news-pipeline
  cancel-in-progress: false


# ================================================================
# BUILD
# ================================================================

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            gspread \
            google-auth \
            openai \
            requests \
            feedparser \
            beautifulsoup4 \
            python-dateutil \
            lxml

      # ------------------------------------------------------------
      # COLLECTOR
      # ------------------------------------------------------------

      - name: Run collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          python collector.py

      # ------------------------------------------------------------
      # RULE ENGINE
      # ------------------------------------------------------------

      - name: Run rule engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          python rule_engine.py

      # ------------------------------------------------------------
      # BRIEFING ENGINE
      # ------------------------------------------------------------

      - name: Run briefing engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python briefing_engine.py

      # ------------------------------------------------------------
      # REPORT ENGINE
      # ------------------------------------------------------------

      - name: Run report engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python report_engine.py

      # ------------------------------------------------------------
      # VERIFY WEBSITE
      # ------------------------------------------------------------

      - name: Verify generated website
        run: |
          echo "============================================================"
          echo "VERIFYING GENERATED WEBSITE"
          echo "============================================================"

          find site -maxdepth 3 -type f -print | sort

          echo ""
          echo "Checking required files..."

          test -f site/index.html
          test -f site/archive.html
          test -f site/assets/style.css

          echo "index.html   OK"
          echo "archive.html OK"
          echo "style.css    OK"

      # ------------------------------------------------------------
      # SAVE WEBSITE TO REPOSITORY
      # ------------------------------------------------------------

      - name: Persist website archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/

          if git diff --cached --quiet; then
            echo "[GIT] No website changes."
          else
            git commit -m "Update medical news report site"
            git push
          fi

      # ------------------------------------------------------------
      # CONFIGURE PAGES
      # ------------------------------------------------------------

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # UPLOAD PAGES ARTIFACT
      # ------------------------------------------------------------

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site


  # ================================================================
  # DEPLOY
  # ================================================================

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show Pages URL
        run: |
          echo "============================================================"
          echo "GITHUB PAGES URL"
          echo "============================================================"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "============================================================"
