name: Medical News Intelligence

on:
  schedule:
    # 22:30 Asia/Ho_Chi_Minh = 15:30 UTC
    - cron: "30 15 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: medical-news-pipeline
  cancel-in-progress: false

jobs:
  medical-news:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            gspread \
            google-auth \
            openai \
            requests \
            feedparser \
            beautifulsoup4 \
            python-dateutil \
            lxml

      # ============================================================
      # 4. COLLECTOR
      # ============================================================

      - name: Run collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          python collector.py

      # ============================================================
      # 5. RULE ENGINE
      # ============================================================

      - name: Run rule engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          python rule_engine.py

      # ============================================================
      # 6. BRIEFING ENGINE
      # ============================================================

      - name: Run briefing engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python briefing_engine.py

      # ============================================================
      # 7. REPORT ENGINE
      # ============================================================

      - name: Run report engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python report_engine.py

      # ============================================================
      # 8. VERIFY GENERATED WEBSITE
      # ============================================================

      - name: Verify generated website
        run: |
          echo "============================================================"
          echo "VERIFYING GENERATED WEBSITE"
          echo "============================================================"

          test -f site/index.html
          test -f site/archive.html
          test -f site/assets/style.css

          echo ""
          echo "Generated files:"
          find site -maxdepth 3 -type f -print | sort

          echo ""
          echo "index.html:"
          ls -lh site/index.html

          echo ""
          echo "archive.html:"
          ls -lh site/archive.html

      # ============================================================
      # 9. PERSIST WEBSITE / ARCHIVE
      # ============================================================

      - name: Persist website archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/

          if git diff --cached --quiet; then
            echo "[GIT] No website changes to commit."
          else
            git commit -m "Update medical news report site"
            git push
          fi

      # ============================================================
      # 10. SETUP GITHUB PAGES
      # ============================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # 11. UPLOAD WEBSITE
      # ============================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      # ============================================================
      # 12. DEPLOY
      # ============================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ============================================================
      # 13. SUMMARY
      # ============================================================

      - name: Pipeline summary
        run: |
          echo "============================================================"
          echo "MEDICAL NEWS PIPELINE COMPLETED"
          echo "============================================================"
          echo "GitHub Pages: ${{ steps.deployment.outputs.page_url }}"
          echo "============================================================"
