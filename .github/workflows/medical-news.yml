name: Medical News Intelligence

on:
  schedule:
    # 22:30 Asia/Ho_Chi_Minh = 15:30 UTC
    - cron: "30 15 * * *"

  workflow_dispatch:

concurrency:
  group: medical-news-pipeline
  cancel-in-progress: false


# ================================================================
# BUILD
# ================================================================

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    outputs:
      has_report: ${{ steps.check_report.outputs.has_report }}

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ------------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            gspread \
            google-auth \
            openai \
            requests \
            feedparser \
            beautifulsoup4 \
            python-dateutil \
            lxml


      # ============================================================
      # 1. COLLECTOR
      # ============================================================

      - name: Run collector
        id: collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          set -o pipefail

          python collector.py 2>&1 | tee collector.log

          echo ""
          echo "============================================================"
          echo "CHECKING COLLECTOR RESULT"
          echo "============================================================"

          if grep -Eq "New articles saved: [1-9][0-9]*" collector.log; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "[PIPELINE] New articles detected."
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "[PIPELINE] No new articles detected."
          fi


      # ============================================================
      # 2. RULE ENGINE
      # ============================================================

      - name: Run rule engine
        if: steps.collector.outputs.has_new == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          python rule_engine.py


      # ============================================================
      # 3. BRIEFING ENGINE
      # ============================================================

      - name: Run briefing engine
        if: steps.collector.outputs.has_new == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python briefing_engine.py


      # ============================================================
      # 4. REPORT ENGINE
      # ============================================================

      - name: Run report engine
        if: steps.collector.outputs.has_new == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python report_engine.py


      # ============================================================
      # 5. CHECK WHETHER A REPORT WAS ACTUALLY GENERATED
      # ============================================================

      - name: Check generated report
        id: check_report
        run: |
          echo "============================================================"
          echo "CHECKING GENERATED REPORT"
          echo "============================================================"

          if [ -f "site/index.html" ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"

            echo "[SITE] Report site detected."

            echo ""
            echo "Generated files:"
            find site -maxdepth 3 -type f -print | sort

          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"

            echo "[SITE] No report generated."
            echo "[PIPELINE] Nothing to publish."
          fi


      # ============================================================
      # 6. VERIFY WEBSITE
      # ============================================================

      - name: Verify generated website
        if: steps.check_report.outputs.has_report == 'true'
        run: |
          echo "============================================================"
          echo "VERIFYING GENERATED WEBSITE"
          echo "============================================================"

          test -f site/index.html
          test -f site/archive.html
          test -f site/assets/style.css

          echo "index.html   OK"
          echo "archive.html OK"
          echo "style.css    OK"


      # ============================================================
      # 7. PERSIST WEBSITE / ARCHIVE
      # ============================================================

      - name: Persist website archive
        if: steps.check_report.outputs.has_report == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/

          if git diff --cached --quiet; then
            echo "[GIT] No website changes."
          else
            git commit -m "Update medical news report site"
            git push
          fi


      # ============================================================
      # 8. CONFIGURE GITHUB PAGES
      # ============================================================

      - name: Setup GitHub Pages
        if: steps.check_report.outputs.has_report == 'true'
        uses: actions/configure-pages@v5


      # ============================================================
      # 9. UPLOAD PAGES ARTIFACT
      # ============================================================

      - name: Upload GitHub Pages artifact
        if: steps.check_report.outputs.has_report == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site


  # ================================================================
  # DEPLOY
  # ================================================================

  deploy:
    runs-on: ubuntu-latest

    needs: build

    if: needs.build.outputs.has_report == 'true'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ------------------------------------------------------------
      # DEPLOY
      # ------------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      # ------------------------------------------------------------
      # SHOW URL
      # ------------------------------------------------------------

      - name: Show Pages URL
        run: |
          echo "============================================================"
          echo "GITHUB PAGES URL"
          echo "============================================================"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "============================================================"
